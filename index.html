<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form - Arwa Ghabn</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }
        h1 { color: #0F3B5F; text-align: center; }
        p.student { text-align: center; font-weight: bold; }
        form {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
        }
        fieldset { margin-bottom: 20px; border: 2px solid #0F3B5F; border-radius: 8px; }
        legend { font-weight: bold; color: #0F3B5F; }
        label { font-weight: bold; }
        input, textarea, select {
            width: 95%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input[type="radio"], input[type="checkbox"] { width: auto; }
        input[type="range"] { width: 95%; }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button[type="submit"] { background: #0F3B5F; color: white; }
        button[type="reset"] { background: #ccc; }
    </style>
</head>
<body>

    <h1>User Registration</h1>
    <p class="student">Student: Arwa Ghabn</p>

    <form action="/register" method="POST" enctype="multipart/form-data">

        <!-- TODO 1: Personal Information -->
        <fieldset>
            <legend>Personal Information</legend>

            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" required minlength="3" placeholder="Enter your full name"><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required placeholder="example@email.com"><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required minlength="8" placeholder="At least 8 characters"><br>

            <label for="confirm-password">Confirm Password:</label><br>
            <input type="password" id="confirm-password" name="confirm-password" required minlength="8" placeholder="Repeat password"><br>

            <label for="dob">Date of Birth:</label><br>
            <input type="date" id="dob" name="dob" required><br>
        </fieldset>

        <!-- TODO 2: Contact Information -->
        <fieldset>
            <legend>Contact Information</legend>

            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" title="Format: 059-123-4567" placeholder="059-123-4567"><br>

            <label for="address">Address:</label><br>
            <textarea id="address" name="address" rows="3" cols="40" placeholder="Enter your address"></textarea><br>

            <label for="city">City:</label><br>
            <select id="city" name="city" required>
                <option value="">-- Select City --</option>
                <option value="gaza">Gaza</option>
                <option value="khan-younis">Khan Younis</option>
                <option value="rafah">Rafah</option>
                <option value="deir-al-balah">Deir al-Balah</option>
                <option value="jabalia">Jabalia</option>
                <option value="beit-lahia">Beit Lahia</option>
            </select><br>
        </fieldset>

        <!-- TODO 3: Preferences -->
        <fieldset>
            <legend>Preferences</legend>

            <p>Gender:</p>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br><br>

            <p>Interests:</p>
            <input type="checkbox" id="coding" name="interests" value="coding">
            <label for="coding">Coding</label><br>
            <input type="checkbox" id="design" name="interests" value="design">
            <label for="design">Design</label><br>
            <input type="checkbox" id="gaming" name="interests" value="gaming">
            <label for="gaming">Gaming</label><br>
            <input type="checkbox" id="reading" name="interests" value="reading">
            <label for="reading">Reading</label><br>
            <input type="checkbox" id="sports" name="interests" value="sports">
            <label for="sports">Sports</label><br><br>

            <label for="skill">Skill Level (1-10):</label><br>
            <input type="range" id="skill" name="skill" min="1" max="10" value="5"><br>
        </fieldset>

        <!-- TODO 4: Profile Picture -->
        <label for="photo">Profile Picture:</label><br>
        <input type="file" id="photo" name="photo" accept="image/*"><br><br>

        <!-- TODO 5: Terms and Buttons -->
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the Terms and Conditions</label><br><br>

        <button type="submit">Register</button>
        <button type="reset">Clear Form</button>

    </form>

</body>
</html>
